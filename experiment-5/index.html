<html>
    
    <head>
        <title>Student registration form</title>
        <h1 align="center">Student Registration Form</h1>
        <hr>
        <br>
        </h1>
    </head>
    <body>
        <form>

        <p>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required >
            
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Enter valid email address">

        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password" required>

        </p>
        <p>
            Gender:

            
            <input type="radio" id="male" value="male">
            <label for="gender">Male</label>
            <input type="radio" id="female" value="female">
            <label for="gender">Female</label>
            <input type="radio" id="other" value="other">
            <label for="gender">Other</label>
            
        </p>
        <p>
            <label for="select course">Course:</label>
            <select id="select course">Select course</select>

        </p>
        <p>
            <label >Contact no:</label>
            <input type="tel" name="contact" placeholder="Enter phone number" required>
            
        </p>
        <p>
            <label>Address:</label>
            <textarea name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>

        </p>
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>
        </form>
        <hr>
        <p align="center">&copy; 2025 Student Registration Form Portal</p>
    </body>
</html>
