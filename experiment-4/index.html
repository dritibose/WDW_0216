<html>
    <head>

    </head>
    <body>
        <h1 align="center"> Hotel Room Booking Form</h1>
        <form action="#" method="post" align="center">

        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
        
        
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" required>
        <br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" required>
        <br><br>
        
        <label for="roomtype">Room Type</label>
        <select id="room">
            <option value="">Single Room</option>
            <option value="Single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="deluxe">Deluxe Room</option>
            <option value="suite">suit</option>
        </select>
        <br><br>
        <label for="guests">Number of Guests: </label>
        <input type="number" id="guest" min="1" max="10" value="0" required>
        <br><br>

        <label for="specialrequest">Special Request:</label>
        <br>
        <textarea col="10" row="100" required align="center"></textarea>
        <br><br>

        <input type="submit" value="Book Now" required>
        <input type="reset" value="Reset Form" required>

        </form>
    </body>
</html>
