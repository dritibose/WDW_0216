<html>
    <head>

    </head>
    <body>
        <h1 align="center"> Hotel Room Booking Form</h1>
        <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
        <br>
        <br>

        <label for="gender">Gender:</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="gender">Female</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="gender">Male</label>
        
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required>
        <br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" required>
        <br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" required>
        <br><br>
        
        <label for="roomtype">Room type</label>
        <select id="room">
            <option value="">Select a room type</option>
            <option value="Single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="deluxe">Deluxe Room</option>
            <option value="suite">suit</option>
        </select>
        <br><br>
        <label for="guests">Number of guests: </label>
        <input type="number" id="guest" min="1" max="10" value="0" required>
        <br><br>

        <label for="specialrequest">Special request</label>
        <textarea col="4" row="50" required></textarea>
        <br><br>

        <input type="submit" value="Submit Now" required>
        <input type="reset" value="Reset the form" required>

        </form>
    </body>
</html>
